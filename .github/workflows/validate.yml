name: Validate package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest and structure
        run: python scripts/validate_package.py
      - name: Verify additive compatibility with previous baselines
        run: |
          python scripts/check_additive_changes.py --baseline ARCHIVE/PREVIOUS-BASELINES/BASELINE-V1/PACKAGE-MANIFEST.json
          python scripts/check_additive_changes.py --baseline ARCHIVE/PREVIOUS-BASELINES/BASELINE-V2/PACKAGE-MANIFEST.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
