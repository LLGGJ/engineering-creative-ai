<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demonstração — preferências de cookies</title>
  <link rel="stylesheet" href="cookie-consent.css">
  <script defer src="cookie-consent.js"></script>
</head>
<body>
  <main style="max-width:760px;margin:10vh auto;padding:24px;font:16px/1.6 system-ui">
    <h1>Exemplo de central de preferências</h1>
    <p>Esta página demonstra apenas a interface e a persistência local de preferências. Nenhum fornecedor de analytics ou publicidade é carregado.</p>
    <button type="button" onclick="window.CookieConsent?.openPreferences()">Abrir preferências</button>
    <p id="choice" aria-live="polite">Aguardando inicialização…</p>
  </main>
  <script>
    window.addEventListener("cookieconsent:ready", (event) => {
      const output = document.getElementById("choice");
      const update = (state) => output.textContent = "Estado: " + state.status + " | analytics: " + state.categories.analytics + " | marketing: " + state.categories.marketing;
      update(event.detail);
      window.addEventListener("cookieconsent:change", (change) => update(change.detail));
    });
  </script>
</body>
</html>
